connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083

# S3 / MinIO Connection (fs.native-s3 required for Trino 480+)
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.path-style-access=true

# Old config (Trino < 480, hive.s3.* properties)
#hive.s3.endpoint=http://minio:9000
#hive.s3.aws-access-key=minioadmin
#hive.s3.aws-secret-key=minioadmin
#hive.s3.path-style-access=true
#hive.s3.ssl.enabled=false

# Delta Lake Specifics
delta.register-table-procedure.enabled=true

# Allow writes to Delta Lake tables from Trino, 
# but only if there are no concurrent writes happening
delta.enable-non-concurrent-writes=true